<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>Kiosk Display Blocker</title>
    <style>
        body {
            width: 220px;
            padding: 16px;
            font-family: Arial, sans-serif;
            background: #181818;
            color: white;
        }

        .container {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .switch {
            position: relative;
            width: 44px;
            height: 24px;
        }

        .switch input {
            display: none;
        }

        .slider {
            position: absolute;
            inset: 0;
            background: #555;
            border-radius: 20px;
            cursor: pointer;
            transition: 0.2s;
        }

        .slider::before {
            content: "";
            position: absolute;
            width: 18px;
            height: 18px;
            left: 3px;
            top: 3px;
            background: white;
            border-radius: 50%;
            transition: 0.2s;
        }

        input:checked+.slider {
            background: #16a34a;
        }

        input:checked+.slider::before {
            transform: translateX(20px);
        }

        #status {
            margin-top: 12px;
            color: #aaa;
            font-size: 12px;
        }
    </style>
</head>

<body>
    <div class="container">
        <strong>Protection</strong>

        <label class="switch">
            <input type="checkbox" id="toggle">
            <span class="slider"></span>
        </label>
    </div>

    <div id="status">Loading...</div>

    <script src="popup.js"></script>
</body>

</html>
